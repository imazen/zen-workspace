name: Rust CI (reusable)

on:
  workflow_call:
    inputs:
      test_args:
        description: 'cargo test arguments (e.g., "--all-targets --features foo")'
        type: string
        default: '--all-targets'
      test_extra_runs:
        description: 'Additional test invocations, one per line (e.g., "cargo test --no-default-features")'
        type: string
        default: ''
      clippy_args:
        description: 'cargo clippy arguments'
        type: string
        default: '--all-targets -- -D warnings'
      clippy_extra_runs:
        description: 'Additional clippy invocations, one per line'
        type: string
        default: ''
      platforms:
        # macOS dropped from the default 2026-06-03 to cut Actions spend — macOS
        # 3-core bills at ~10x Linux and was the dominant cost. Repos that truly
        # need macOS coverage can opt back in by passing `platforms` explicitly
        # with "macos-latest" / "macos-26-intel".
        description: 'JSON array of OS runners (default: Linux + Windows, no macOS)'
        type: string
        default: |
          ["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm"]
      skip_msrv:
        description: 'Skip MSRV check'
        type: boolean
        default: false
      sibling_overrides:
        description: 'Override declared dependency pins with sibling checkouts'
        type: boolean
        default: true
      workspace_ref:
        description: 'zen-workspace ref to use'
        type: string
        default: 'main'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: imazen/zen-workspace/.github/actions/setup@682b725a555350afefab5e0f936fbb7955d95a64
        with:
          components: rustfmt
          workspace-ref: ${{ inputs.workspace_ref }}
          sibling-overrides: ${{ inputs.sibling_overrides }}
      # Scope to in-repo workspace members: `cargo fmt --all` also reaches
      # into path-dependency crates, and after ci-clone those are sibling
      # clones of OTHER repos (their formatting is not this repo's gate).
      - name: Check workspace formatting
        shell: bash
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          mapfile -t package_args < <(jq -r '.packages[] | "-p", .name' <<< "$metadata")
          cargo fmt "${package_args[@]}" -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@v6
      - uses: imazen/zen-workspace/.github/actions/setup@682b725a555350afefab5e0f936fbb7955d95a64
        with:
          components: clippy
          workspace-ref: ${{ inputs.workspace_ref }}
          sibling-overrides: ${{ inputs.sibling_overrides }}
      - run: cargo clippy ${{ inputs.clippy_args }}
      - name: Extra clippy runs
        if: inputs.clippy_extra_runs != ''
        shell: bash
        run: |
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            $cmd
            echo "::endgroup::"
          done <<< "${{ inputs.clippy_extra_runs }}"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@v6
      - uses: imazen/zen-workspace/.github/actions/setup@682b725a555350afefab5e0f936fbb7955d95a64
        with:
          workspace-ref: ${{ inputs.workspace_ref }}
          sibling-overrides: ${{ inputs.sibling_overrides }}
      - run: cargo test ${{ inputs.test_args }}
      - name: Extra test runs
        if: inputs.test_extra_runs != ''
        shell: bash
        run: |
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            $cmd
            echo "::endgroup::"
          done <<< "${{ inputs.test_extra_runs }}"

  msrv:
    name: MSRV
    if: inputs.skip_msrv == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: imazen/zen-workspace/.github/actions/setup@682b725a555350afefab5e0f936fbb7955d95a64
        with:
          workspace-ref: ${{ inputs.workspace_ref }}
          sibling-overrides: ${{ inputs.sibling_overrides }}
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --rust-version
